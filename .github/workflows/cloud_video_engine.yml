name: Foji 3D Cloud Video Engine (7GB RAM 24/7)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      action_type:
        description: "generate_only, generate_and_publish, or check_schedule"
        required: false
        default: "generate_and_publish"
      custom_topic:
        description: "Optional custom story topic"
        required: false
        default: ""

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-and-publish-reel:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Latest Code & Schedule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hidden Headless Google Chrome & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl ffmpeg
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          rm -f google-chrome-stable_current_amd64.deb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute 100% Hidden Cloud Chrome Worker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          GEMINI_COOKIES_JSON: ${{ secrets.GEMINI_COOKIES_JSON }}
          CLOUD_EVENT_NAME: ${{ github.event_name }}
          CLOUD_ACTION_TYPE: ${{ github.event.inputs.action_type }}
          CLOUD_CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic }}
        run: |
          python cloud_worker.py

      - name: Save Updated History, Telemetry & Schedule Permanently
        run: |
          git config user.name "FojiCloudEngine"
          git config user.email "foji@studio.ai"
          git add data/*.json
          git diff --staged --quiet || (git commit -m "Auto-update reel history & schedule from Cloud" && git push origin HEAD:main)