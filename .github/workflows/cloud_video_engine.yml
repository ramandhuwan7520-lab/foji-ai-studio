name: Foji 3D Cloud Video Engine (7GB RAM 24/7)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      action_type:
        description: "generate_only, generate_and_publish, or check_schedule"
        required: false
        default: "generate_and_publish"
      custom_topic:
        description: "Optional custom story topic"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-publish-reel:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Clone Latest Code Directly (Zero Node.js Actions)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin main
          git checkout -f FETCH_HEAD

      - name: Install Hidden Headless Google Chrome & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl ffmpeg python3-pip python3-venv
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          rm -f google-chrome-stable_current_amd64.deb

      - name: Setup Virtualenv & Python Dependencies
        run: |
          python3 -m venv /tmp/foji_venv
          /tmp/foji_venv/bin/pip install --upgrade pip
          /tmp/foji_venv/bin/pip install -r requirements.txt

      - name: Execute 100% Hidden Cloud Chrome Worker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          GEMINI_COOKIES_JSON: ${{ secrets.GEMINI_COOKIES_JSON }}
          CLOUD_EVENT_NAME: ${{ github.event_name }}
          CLOUD_ACTION_TYPE: ${{ github.event.inputs.action_type }}
          CLOUD_CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic }}
        run: |
          /tmp/foji_venv/bin/python cloud_worker.py

      - name: Save Updated History, 3D Telemetry & Schedule Permanently
        run: |
          git config user.name "FojiCloudEngine"
          git config user.email "foji@studio.ai"
          git add data/*.json || true
          git diff --staged --quiet || (git commit -m "Auto-update reel history & 3D telemetry from Cloud" && git push origin HEAD:main)