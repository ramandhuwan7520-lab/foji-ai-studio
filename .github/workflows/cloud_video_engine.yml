name: Foji 3D Cloud Studio Worker

on:
  workflow_dispatch:
    inputs:
      batch_count:
        description: 'Number of videos to generate'
        required: false
        default: '1'
      track_id:
        description: 'Series Track ID'
        required: false
        default: ''
      custom_idea:
        description: 'Custom Director Twist'
        required: false
        default: ''
  schedule:
    - cron: '0 21 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  generate_foji_reel:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11 (Cached & Fast)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Fast Verify Pre-Installed Chrome & Xvfb (Takes 5 Seconds instead of 1 Hour!)
        run: |
          if ! command -v xvfb-run &> /dev/null; then
            sudo apt-get update -o Acquire::Retries=2 && sudo apt-get install -y --no-install-recommends xvfb ffmpeg
          fi
          google-chrome --version
          ffmpeg -version | head -n 1

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip -q
          if [ -f requirements.txt ]; then pip install -r requirements.txt -q; fi
          pip install requests selenium python-dotenv instagrapi imageio-ffmpeg flask -q

      - name: Run 13-Step Gemini 3D Video Pipeline Inside Virtual Display
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_COOKIES_JSON: ${{ secrets.GEMINI_COOKIES_JSON }}
          GEMINI_COOKIES_JSON_2: ${{ secrets.GEMINI_COOKIES_JSON_2 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT || secrets.GH_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_PAT || secrets.GH_TOKEN || github.token }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
          BATCH_COUNT: ${{ github.event.inputs.batch_count || '1' }}
          FORCE_TRACK_ID: ${{ github.event.inputs.track_id || '' }}
          CUSTOM_IDEA: ${{ github.event.inputs.custom_idea || '' }}
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" python cloud_runner.py
