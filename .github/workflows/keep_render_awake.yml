name: 24x7 Render Keep-Alive Pinger

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Foji AI Studio Render Server
        run: |
          curl -s -L --max-time 15 "${{ secrets.RENDER_EXTERNAL_URL || 'https://foji-ai-studio-live.onrender.com' }}/api/ping" || true
          curl -s -L --max-time 15 "https://foji-ai-studio.onrender.com/api/ping" || true
